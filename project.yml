# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: Carrel
options:
  bundleIdPrefix: au.com.bitcoinbrisbane
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  LBRYKit:
    path: Packages/LBRYKit

targets:
  Carrel:
    type: application
    platform: iOS
    sources:
      - path: Carrel
        excludes: [PrivacyInfo.xcprivacy]
      - path: Carrel/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LBRYKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.bitcoinbrisbane.carrel
        MARKETING_VERSION: "0.1.0"
        # scripts/archive.sh overrides this with the commit count, so every upload goes up.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"    # iPhone only for v1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    # iCloud key-value storage, so the encrypted taste/library backup syncs between
    # devices. Needs your Apple developer team for signing (DEVELOPMENT_TEAM), so it's
    # opt-in: uncomment, set the team in Xcode, and run xcodegen. Without it, backups
    # still work but stay on this device.
    # entitlements:
    #   path: Carrel/Carrel.entitlements
    #   properties:
    #     com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: Carrel/Info.plist
      properties:
        CFBundleDisplayName: Carrel
        UILaunchScreen: {}
        # Export compliance: only standard, exempt encryption (HTTPS, AES-GCM,
        # secp256k1 signing, X25519). Signed off by Lucas, 7 Nov 2026.
        ITSAppUsesNonExemptEncryption: false
        # Guideline 1.2: where reports go, and the privacy policy. Set both before
        # archiving (scripts/archive.sh refuses an empty support address).
        CarrelSupportEmail: ""
        CarrelPrivacyPolicyURL: ""
        # Ethereum account, token sends and the lbc.exchange bridge: hidden in Release
        # builds for the first review (always on in Debug). Set true to ship them.
        CarrelEthereumEnabled: false
        # UIBackgroundModes: [audio]   # back with background audio (#22); unused modes get flagged in review
        CFBundleURLTypes:
          - CFBundleURLName: au.com.bitcoinbrisbane.carrel.lbry
            CFBundleURLSchemes: [lbry]
          # Tips started on Apple TV: its QR code opens carrel://tip?uri=lbry://…
          - CFBundleURLName: au.com.bitcoinbrisbane.carrel.tip
            CFBundleURLSchemes: [carrel]

  CarrelTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: CarrelTV
        excludes: [PrivacyInfo.xcprivacy]
      - path: CarrelTV/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Shared with the iPhone app: taste, library and stream-URL stores.
      - Carrel/Model/Persistence.swift
    dependencies:
      - package: LBRYKit
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Same bundle ID as the iPhone app, so the App Store can offer it as one
        # universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: au.com.bitcoinbrisbane.carrel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # iCloud key-value storage: syncing taste, follows and history with the iPhone
    # (Library › Link iPhone). Opt-in like the iPhone target: uncomment both blocks,
    # set your team, run xcodegen. Same bundle ID, so both share one store.
    # entitlements:
    #   path: CarrelTV/CarrelTV.entitlements
    #   properties:
    #     com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: CarrelTV/Info.plist
      properties:
        CFBundleDisplayName: Carrel
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CarrelSupportEmail: ""
        CarrelPrivacyPolicyURL: ""
